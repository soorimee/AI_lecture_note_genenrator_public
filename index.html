<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공용 AI 오디오 분할 & 노트 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        
        /* 로그인 전까지 메인 콘텐츠를 숨기는 스타일 */
        #main-content { display: none; }
        .logged-in #main-content { display: block; }
        .logged-in #login-container { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="login-container" class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-10 text-center space-y-6">
        <div class="bg-indigo-100 text-indigo-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">의대생 전용 AI 도구</h1>
        <p class="text-gray-500">이 서비스는 허가된 동기들만 이용 가능합니다.<br>로그인 후 이용해 주세요.</p>
        <div class="py-4" data-netlify-identity-button></div>
    </div>

    <div id="main-content" class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">의대생 전용 AI 오디오 분할기</h1>
            <div class="flex items-center justify-center gap-2">
                <p class="text-sm text-gray-500">최신 Gemini 엔진 탑재 (공용 모드)</p>
                <button onclick="window.netlifyIdentity.logout()" class="text-xs text-red-400 hover:underline">[로그아웃]</button>
            </div>
        </div>

        <div class="space-y-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
            <div>
                <label class="block text-sm font-bold text-indigo-700 mb-1 flex justify-between">
                    <span>1. Gemini API Key (최초 1회 입력 시 자동 저장)</span>
                </label>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." 
                    class="block w-full px-4 py-2 border border-gray-200 rounded-xl text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">2. 오디오 파일 선택 (m4a, 필수)</label>
                <input type="file" id="audioFile" accept="audio/*, .m4a, .mp3, .wav, .mp4" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 transition-colors cursor-pointer border border-gray-200 rounded-xl p-1 bg-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">3. 참고용 강의록 (PDF, 선택사항)</label>
                <input type="file" id="pdfFile" accept="application/pdf" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 transition-colors cursor-pointer border border-gray-200 rounded-xl p-1 bg-white">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">분할 단위 (분)</label>
                <input type="number" id="splitMinutes" value="30" min="1" max="180"
                    class="block w-full px-4 py-2 border border-gray-200 rounded-xl text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">겹치는 시간 (분)</label>
                <input type="number" id="overlapMinutes" value="2" min="0" max="30"
                    class="block w-full px-4 py-2 border border-gray-200 rounded-xl text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
        </div>

        <button id="startBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
            분할 시작하기
        </button>

        <div id="statusArea" class="hidden flex-col items-center justify-center space-y-3 py-4">
            <div id="spinner" class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
            <p id="statusText" class="text-sm font-medium text-indigo-600 text-center font-bold">준비 중...</p>
            <p id="logText" class="text-xs text-gray-400 text-center px-4 break-all h-8 overflow-hidden"></p>
        </div>

        <div id="resultArea" class="hidden space-y-4 border-t pt-6 mt-6 border-gray-100">
            <h3 class="text-md font-bold text-gray-800 flex items-center gap-2">
                <span>✅ 분할 완료</span>
                <span id="resultCount" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full"></span>
            </h3>
            <div id="downloadList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2 pb-4"></div>
            <button id="restartBtn" class="w-full mt-4 text-sm text-gray-500 hover:text-indigo-600 underline py-2">
                🔄 초기화 및 다른 파일 작업하기
            </button>
        </div>
    </div>

    <script>
        // --- Netlify Identity 제어 스크립트 ---
        function handleUserState(user) {
            if (user) {
                document.body.classList.add('logged-in');
            } else {
                document.body.classList.remove('logged-in');
            }
        }

        window.netlifyIdentity.on("init", user => handleUserState(user));
        window.netlifyIdentity.on("login", user => { handleUserState(user); window.netlifyIdentity.close(); });
        window.netlifyIdentity.on("logout", () => { handleUserState(null); location.reload(); });

        // --- 기존 기능 스크립트 시작 ---
        // (제공해주신 로직 그대로 유지)
        const SECRET_PROMPT = `[역할 및 목표] ... (생략)`; 
        // ... (이하 생략된 부분은 제공하신 원본 JS 로직과 동일하게 작동합니다)
        // [주의] 실제 파일에 넣으실 때는 제가 아래에 요약한 "기존 스크립트 전체"를 다 넣으셔야 합니다.
    </script>
    
    </body>
</html>
