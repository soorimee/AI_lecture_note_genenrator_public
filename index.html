<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공용 AI 오디오 분할 & 노트 생성기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FFmpeg.wasm 라이브러리 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 sm:p-8 space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">의대생 전용 AI 오디오 분할기</h1>
            <p class="text-sm text-gray-500">최신 Gemini 엔진 탑재 (공용 모드)</p>
        </div>

        <!-- API Key & File Input Area -->
        <div class="space-y-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
            <div>
                <label class="block text-sm font-bold text-indigo-700 mb-1 flex justify-between">
                    <span>1. Gemini API Key (최초 1회 입력 시 자동 저장)</span>
                </label>
                <!-- API 키 입력란 부활 -->
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." 
                    class="block w-full px-4 py-2 border border-gray-200 rounded-xl text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">2. 오디오 파일 선택 (m4a, 필수)</label>
                <input type="file" id="audioFile" accept="audio/*, .m4a, .mp3, .wav, .mp4" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 transition-colors cursor-pointer border border-gray-200 rounded-xl p-1 bg-white">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">3. 참고용 강의록 (PDF, 선택사항)</label>
                <input type="file" id="pdfFile" accept="application/pdf" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 transition-colors cursor-pointer border border-gray-200 rounded-xl p-1 bg-white">
                <p class="text-xs text-gray-400 mt-1 pl-1">※ 의학 용어 및 철자 교차 검증용으로 활용됩니다.</p>
            </div>
        </div>

        <!-- Time Settings -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">분할 단위 (분)</label>
                <input type="number" id="splitMinutes" value="30" min="1" max="180"
                    class="block w-full px-4 py-2 border border-gray-200 rounded-xl text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">겹치는 시간 (분)</label>
                <input type="number" id="overlapMinutes" value="2" min="0" max="30"
                    class="block w-full px-4 py-2 border border-gray-200 rounded-xl text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
        </div>

        <button id="startBtn" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
            분할 시작하기
        </button>

        <!-- Status & Logs -->
        <div id="statusArea" class="hidden flex-col items-center justify-center space-y-3 py-4">
            <div id="spinner" class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
            <p id="statusText" class="text-sm font-medium text-indigo-600 text-center font-bold">준비 중...</p>
            <p id="logText" class="text-xs text-gray-400 text-center px-4 break-all h-8 overflow-hidden"></p>
        </div>

        <!-- Result Area -->
        <div id="resultArea" class="hidden space-y-4 border-t pt-6 mt-6 border-gray-100">
            <h3 class="text-md font-bold text-gray-800 flex items-center gap-2">
                <span>✅ 분할 완료</span>
                <span id="resultCount" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full"></span>
            </h3>
            
            <div id="downloadList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2 pb-4">
            </div>

            <button id="restartBtn" class="w-full mt-4 text-sm text-gray-500 hover:text-indigo-600 underline py-2">
                🔄 초기화 및 다른 파일 작업하기
            </button>
        </div>
    </div>

    <script>
        // --- 1. 철저히 통제된 프롬프트 (목차 간소화 및 환각 방지) ---
        const SECRET_PROMPT = `[역할 및 목표]
- 당신은 의과대학 본과 수석 필기 담당자입니다.
- 목표: 제공된 '오디오 파일(해당 차시의 녹취록)'만을 정밀 분석하여 시험 대비용 강의 노트를 작성합니다.

[★ 가장 중요한 절대 규칙 (환각 방지) ★]
1. 철저한 오디오 기반: 제공된 오디오 파일에서 교수님이 **직접 입으로 발화한 내용만** 요약하고 정리하세요.
2. 타 정보 혼합 금지: 오디오에서 들리지 않는 내용을 앞뒤 문맥을 임의로 상상하거나 지어내서 적지 마세요. 이 오디오 파일의 범위(시간)에 해당하는 내용만 정리해야 합니다.

[작업 지침]
1. **(★필수) 언어 및 용어 표기 원칙:**
    - 설명 및 문장 구조: 한국어(Korean)로 자연스럽게 서술하세요.
    - 의학 용어(Medical Terminology): 해부학적 구조, 질병명, 약물명, 시술명, 증상 등의 핵심 의학 용어는 반드시 **영어(English) Full Name** 혹은 **통용되는 영어 약어**로 표기하세요.

2. **간결한 목차 우선 생성 (Concise Structure First):**
    - 제공된 오디오 내용만 분석하여 논리적 흐름에 따른 [목차]를 가장 먼저 제시하되, **절대로 목차를 너무 세세하게 나누지 마세요.**
    - **오직 '대주제(1.)'와 '소주제(1-1.)' 딱 2단계까지만 간결하게 작성하세요.**
    - [올바른 목차 작성 예시]:
      1. 직업성 및 환경성 폐질환 개요
         1-1. 질환의 특징과 진단적 접근
         1-2. 흡입 물질의 특성에 따른 침착 기전
      2. 주요 직업성 폐질환 각론
         2-1. 석면폐증 (Asbestosis) 및 관련 악성 종양
         2-2. 규폐증 (Silicosis)

3. **내용 서술 (Detailing) 및 근거 준수:**
    - 위에서 만든 2단계 목차의 순서대로 상세 내용을 서술하세요.
    - 문맥상 생략된 주어/목적어를 보완하여 완결된 문장으로 정리하고, 기전이나 인과관계는 축약 없이 풀어서 설명하세요.
    - 전사 내용이 불명확하여 해독이 불가능한 부분은 임의로 추측하지 말고 **[?? 내용 확인 필요]**로 표시하세요.

4. **(★중요) 교수님 예제/가정 상황 포착:**
    - 교수님이 "만약에 문제를 이렇게 낸다면~", "이런 경우에는 이렇게 해야겠지?" 처럼 구체적인 예시나 상황을 가정하여 설명하는 부분을 절대 놓치지 마세요.
    - 해당 내용은 **(★교수님 예제/상황 가정)** 태그를 붙여 별도로 눈에 띄게 서술하세요.

5. **중요도 표기:**
    - 반복 설명된 내용은 **(★반복 강조)** 태그와 함께 굵게 표시하세요.
    - "국시", "시험", "야마", "족보", "중요하다" 언급 시 **(★국시/시험 출제 유력)** 태그를 붙이세요.

6. **서식 규칙:**
    - 화학식, 이온 등은 LaTeX($) 없이 일반 텍스트로 표기하세요. (예: Ca2+, HCO3-)
    - 가독성을 위해 개조식(Bullet point)을 적극 활용하세요.

[출력 형식]
# [제공된 파일명에 기반한 년월일, 교시, 차시] 녹취록 기반 강의 정리
(예시: 제공된 파일명이 '0402 이환진pf 1교시 1차시 (0분~30분).m4a' 일 경우 -> # 4월 2일 1교시 1차시 (0분~30분) 녹취록 기반 강의 정리)

**1. [강의 목차]**

1. (대주제)
1-1. (소주제)

**2. [상세 강의 노트]** *(위 목차 순서대로 전개)*

**Topic 1. [목차의 대주제]**

- **상세 설명:**
    - (오디오 녹취록 바탕 심층 설명 - 의학 용어는 영어로)
    - **(★반복 강조) [내용]**
- **(★교수님 예제/상황 가정):** (문제 출제 예시, 상황 설명)
- **(★시험 포인트):** (국시/시험 관련 언급)`;

        // --- 2. 기본 세팅 ---
        const { createFFmpeg, fetchFile } = FFmpeg;
        
        const ffmpeg = createFFmpeg({
            corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            mainName: 'main', 
            log: true,
        });

        const apiKeyInput = document.getElementById('apiKeyInput');
        const fileInput = document.getElementById('audioFile');
        const pdfFileInput = document.getElementById('pdfFile');
        const splitMinutesInput = document.getElementById('splitMinutes');
        const overlapMinutesInput = document.getElementById('overlapMinutes');
        const startBtn = document.getElementById('startBtn');
        const statusArea = document.getElementById('statusArea');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('statusText');
        const logText = document.getElementById('logText');
        const resultArea = document.getElementById('resultArea');
        const downloadList = document.getElementById('downloadList');
        const resultCount = document.getElementById('resultCount');
        const restartBtn = document.getElementById('restartBtn');

        let globalPdfData = null;

        // 브라우저에 저장된 API 키 불러오기
        const savedApiKey = localStorage.getItem('gemini_api_key');
        if (savedApiKey) apiKeyInput.value = savedApiKey;

        // API 키 입력 시 자동 저장
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        ffmpeg.setLogger(({ type, message }) => {
            if(type === 'fferr' || type === 'ffout') logText.innerText = message;
        });

        const getAudioDuration = (file) => {
            return new Promise((resolve, reject) => {
                const audio = new Audio(URL.createObjectURL(file));
                audio.onloadedmetadata = () => resolve(audio.duration);
                audio.onerror = () => reject("오디오 길이를 확인할 수 없습니다. 기기를 재부팅하거나 앱을 껐다 켜보세요.");
            });
        };

        // --- 3. 오디오 분할 로직 ---
        startBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert('먼저 오디오 파일을 선택해주세요.');
                return;
            }

            const segmentMinutes = parseInt(splitMinutesInput.value) || 30;
            const overlapMinutes = parseInt(overlapMinutesInput.value) || 2;

            if (segmentMinutes <= overlapMinutes) {
                alert('분할 단위가 겹치는 시간보다 길어야 합니다.');
                return;
            }

            const apiKey = apiKeyInput.value.trim();
            if (apiKey) localStorage.setItem('gemini_api_key', apiKey);

            startBtn.disabled = true;
            fileInput.disabled = true;
            pdfFileInput.disabled = true;
            statusArea.classList.remove('hidden');
            statusArea.classList.add('flex');
            resultArea.classList.add('hidden');
            downloadList.innerHTML = '';
            spinner.classList.remove('hidden');
            logText.innerText = '';
            globalPdfData = null; 

            try {
                statusText.innerText = '오디오 길이 분석 중...';
                const totalDurationSec = await getAudioDuration(file);
                
                if (!ffmpeg.isLoaded()) {
                    statusText.innerText = '엔진 설정 중... (최초 1회)';
                    await ffmpeg.load();
                }

                const fileName = file.name;
                const lastDotIndex = fileName.lastIndexOf('.');
                let originalNameWithoutExt = fileName;
                let ext = 'm4a'; 
                
                if (lastDotIndex !== -1) {
                    originalNameWithoutExt = fileName.substring(0, lastDotIndex);
                    ext = fileName.substring(lastDotIndex + 1);
                }

                statusText.innerText = '메모리에 파일 올리는 중...';
                const inputName = `input.${ext}`;
                ffmpeg.FS('writeFile', inputName, await fetchFile(file));

                const segmentTimeSec = segmentMinutes * 60;
                const overlapTimeSec = overlapMinutes * 60;
                const stepTimeSec = segmentTimeSec - overlapTimeSec;

                let startTimeSec = 0;
                let segmentIndex = 0;
                
                const ffmpegCommandArgs = ['-i', inputName];
                const expectedFiles = []; 

                while (startTimeSec < totalDurationSec) {
                    const currentOutName = `output_${segmentIndex}.${ext}`;
                    const startMin = Math.round(startTimeSec / 60);
                    const endMin = Math.round(Math.min(startTimeSec + segmentTimeSec, totalDurationSec) / 60);
                    
                    expectedFiles.push({
                        fileName: currentOutName,
                        startMin: startMin,
                        endMin: endMin,
                        index: segmentIndex
                    });

                    ffmpegCommandArgs.push('-ss', startTimeSec.toString());
                    ffmpegCommandArgs.push('-t', segmentTimeSec.toString());
                    ffmpegCommandArgs.push('-c:a', 'aac');
                    ffmpegCommandArgs.push('-b:a', '128k');
                    ffmpegCommandArgs.push(currentOutName);

                    startTimeSec += stepTimeSec;
                    segmentIndex++;
                }

                statusText.innerHTML = `총 ${expectedFiles.length}개의 구간을 새로 만드는 중...<br><span class="text-xs text-gray-500 font-normal">시간이 조금 걸릴 수 있습니다!</span>`;
                
                try {
                    await ffmpeg.run(...ffmpegCommandArgs);
                } catch (runError) {
                    if (runError.message !== 'Program terminated with exit(0)' && runError.message !== 'exit(0)') {
                        throw runError; 
                    }
                }

                statusText.innerText = '결과 파일 정리 및 UI 생성 중...';
                let filesFound = 0;

                for (const seg of expectedFiles) {
                    try {
                        const data = ffmpeg.FS('readFile', seg.fileName);
                        const blob = new Blob([data.buffer], { type: 'audio/mp4' });
                        const url = URL.createObjectURL(blob);
                        
                        const downloadName = `${originalNameWithoutExt} ${seg.index + 1}차시 (${seg.startMin}분~${seg.endMin}분).${ext}`;
                        
                        addResultItem(url, downloadName, blob, seg.index);
                        
                        ffmpeg.FS('unlink', seg.fileName);
                        filesFound++;
                    } catch (e) {
                        console.error('해당 구간 파일 생성 실패:', seg.fileName);
                    }
                }

                ffmpeg.FS('unlink', inputName);

                if (filesFound > 0) {
                    spinner.classList.add('hidden');
                    statusText.innerText = '분할 완료! 🪄 AI 노트 생성 버튼을 눌러보세요.';
                    statusText.classList.replace('text-indigo-600', 'text-green-600');
                    logText.innerText = '';
                    resultCount.innerText = `${filesFound}개 파일`;
                    resultArea.classList.remove('hidden');
                } else {
                    throw new Error('파일 분할 처리 중 문제가 발생했습니다.');
                }

            } catch (error) {
                console.error(error);
                spinner.classList.add('hidden');
                statusText.innerText = '오류가 발생했습니다.';
                statusText.classList.replace('text-indigo-600', 'text-red-500');
                logText.innerText = error.message;
            } finally {
                startBtn.classList.add('hidden');
            }
        });

        // --- 4. UI 렌더링 및 노트 생성 ---
        
        function addResultItem(url, filename, audioBlob, index) {
            const itemDiv = document.createElement('div');
            itemDiv.className = "flex flex-col bg-gray-50 border border-gray-200 rounded-xl overflow-hidden";
            
            const controlHtml = `
                <div class="flex items-center justify-between p-3">
                    <div class="flex items-center gap-3 overflow-hidden w-2/3">
                        <div class="bg-white p-2 rounded-lg shadow-sm border border-gray-100 text-indigo-500 flex-shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-gray-700 truncate">${filename}</span>
                    </div>
                    <div class="flex gap-2">
                        <a href="${url}" download="${filename}" class="px-3 py-1.5 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-semibold hover:bg-gray-100 transition shadow-sm">
                            다운로드
                        </a>
                        <button id="aiBtn_${index}" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition shadow-sm flex items-center gap-1">
                            <span>✨ AI 노트</span>
                        </button>
                    </div>
                </div>
            `;
            
            const noteAreaHtml = `
                <div id="noteArea_${index}" class="hidden flex-col border-t border-gray-200 bg-white p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span id="noteStatus_${index}" class="text-xs font-bold text-indigo-600 animate-pulse">노트 대기중...</span>
                        <button id="copyBtn_${index}" class="hidden text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 hover:bg-gray-200 font-bold">복사하기</button>
                    </div>
                    <p id="errorDetail_${index}" class="hidden text-xs text-red-500 bg-red-50 p-2 rounded mb-2 break-all"></p>
                    <textarea id="noteText_${index}" class="hidden w-full h-64 p-3 border border-gray-100 rounded-lg text-sm text-gray-800 bg-gray-50 focus:outline-none resize-y" readonly></textarea>
                </div>
            `;
            
            itemDiv.innerHTML = controlHtml + noteAreaHtml;
            downloadList.appendChild(itemDiv);

            const aiBtn = itemDiv.querySelector(`#aiBtn_${index}`);
            const noteArea = itemDiv.querySelector(`#noteArea_${index}`);
            const noteStatus = itemDiv.querySelector(`#noteStatus_${index}`);
            const errorDetail = itemDiv.querySelector(`#errorDetail_${index}`);
            const noteText = itemDiv.querySelector(`#noteText_${index}`);
            const copyBtn = itemDiv.querySelector(`#copyBtn_${index}`);

            aiBtn.addEventListener('click', async () => {
                const apiKey = apiKeyInput.value.trim();
                if(!apiKey) {
                    alert('맨 위에서 Gemini API Key를 먼저 입력해주세요!');
                    apiKeyInput.focus();
                    return;
                }

                aiBtn.disabled = true;
                aiBtn.classList.replace('bg-indigo-600', 'bg-gray-400');
                noteArea.classList.remove('hidden');
                noteArea.classList.add('flex');
                errorDetail.classList.add('hidden');
                noteText.classList.add('hidden');
                copyBtn.classList.add('hidden');
                noteStatus.classList.add('animate-pulse');
                noteStatus.classList.replace('text-red-500', 'text-indigo-600');
                noteStatus.classList.replace('text-green-600', 'text-indigo-600');

                try {
                    if (pdfFileInput.files.length > 0 && !globalPdfData) {
                        noteStatus.innerText = '1/5: 🚀 강의록(PDF) 전송 및 분석 대기중...';
                        const pdfFile = pdfFileInput.files[0];
                        globalPdfData = await uploadAndPollFile(pdfFile, 'application/pdf', apiKey, "Lecture_Notes.pdf");
                    }

                    noteStatus.innerText = '2/5: 🎙️ 오디오 파일 전송 중...';
                    const audioData = await uploadAndPollFile(audioBlob, 'audio/mp4', apiKey, `Audio_Segment_${index}.m4a`);

                    noteStatus.innerText = '3/5: ⏳ AI가 오디오를 소화하는 중입니다. (보통 10~20초 소요)';
                    await waitForFileActive(audioData.name, apiKey);
                    if (globalPdfData) {
                        await waitForFileActive(globalPdfData.name, apiKey);
                    }

                    noteStatus.innerText = '4/5: 🔍 사용 가능한 최적의 AI 모델 탐색 중...';
                    const bestModelName = await getBestWorkingModel(apiKey);

                    noteStatus.innerText = `5/5: 🧠 ${bestModelName.replace('models/', '')} 모델이 노트를 작성 중입니다!`;
                    // filename을 파라미터로 넘겨 제목 생성의 기준을 제공합니다.
                    const markdownResult = await generateNotesWithGemini(bestModelName, audioData.uri, globalPdfData ? globalPdfData.uri : null, apiKey, filename);

                    noteStatus.innerText = '✅ 노트 작성이 완료되었습니다!';
                    noteStatus.classList.remove('animate-pulse');
                    noteStatus.classList.replace('text-indigo-600', 'text-green-600');
                    
                    noteText.value = markdownResult;
                    noteText.classList.remove('hidden');
                    copyBtn.classList.remove('hidden');

                } catch(error) {
                    console.error(error);
                    noteStatus.innerText = '❌ 오류가 발생했습니다.';
                    noteStatus.classList.replace('text-indigo-600', 'text-red-500');
                    noteStatus.classList.remove('animate-pulse');
                    
                    errorDetail.innerText = error.message;
                    errorDetail.classList.remove('hidden');
                    
                    aiBtn.disabled = false;
                    aiBtn.classList.replace('bg-gray-400', 'bg-indigo-600');
                }
            });

            copyBtn.addEventListener('click', () => {
                noteText.select();
                document.execCommand('copy');
                copyBtn.innerText = '복사 완료!';
                copyBtn.classList.replace('bg-gray-100', 'bg-green-100');
                copyBtn.classList.replace('text-gray-600', 'text-green-700');
                setTimeout(() => {
                    copyBtn.innerText = '복사하기';
                    copyBtn.classList.replace('bg-green-100', 'bg-gray-100');
                    copyBtn.classList.replace('text-green-700', 'text-gray-600');
                }, 2000);
            });
        }

        // --- 5. Gemini API 통신 함수들 ---

        async function getBestWorkingModel(apiKey) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
            if (!res.ok) throw new Error("모델 목록을 불러올 수 없습니다. API 키가 정확한지 확인해주세요.");
            
            const data = await res.json();
            const validModels = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
            
            // [1순위] 상세한 답변과 안정성: Gemini 2.5 Flash (RPM 2/5 확인됨)
            let best = validModels.find(m => m.name === 'models/gemini-2.5-flash');
            
            // [2순위] 2.5세대의 빠른 응답 버전: Gemini 2.5 Flash-Lite (RPM 0/10 확인됨)
            if (!best) best = validModels.find(m => m.name === 'models/gemini-2.5-flash-lite');
            
            // [3순위] 최신 지능(요약 성향 있음): Gemini 3 Flash (RPM 0/5 확인됨)
            if (!best) {
                best = validModels.find(m => m.name === 'models/gemini-3-flash-preview') || 
                       validModels.find(m => m.name === 'models/gemini-3-flash');
            }
            
            // [4순위] 최신 초경량 모델: Gemini 3.1 Flash-Lite (RPM 0/15 확인됨)
            if (!best) best = validModels.find(m => m.name === 'models/gemini-3.1-flash-lite');
            
            // [5순위] 예외 상황 대비 고성능 오픈 모델: Gemma 3 27B (RPM 0/30 확인됨)
            if (!best) best = validModels.find(m => m.name === 'models/gemma-3-27b');
            
            // [6순위] Gemini 3.1 Pro (할당량이 생길 경우를 대비해 마지막 순위 배치)
            if (!best) best = validModels.find(m => m.name === 'models/gemini-3.1-pro');
            
            // 최종 예외 처리 (1.5 버전은 포함하지 않음)
            if (!best) throw new Error("현재 API 키로 사용할 수 있는 유효한 모델이 없습니다.");

            
            return best.name; 
        }

        async function uploadAndPollFile(blob, mimeType, apiKey, displayName) {
            const initRes = await fetch(`https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'X-Goog-Upload-Protocol': 'resumable',
                    'X-Goog-Upload-Command': 'start',
                    'X-Goog-Upload-Header-Content-Length': blob.size.toString(),
                    'X-Goog-Upload-Header-Content-Type': mimeType,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ file: { display_name: displayName } })
            });

            if(!initRes.ok) {
                const err = await initRes.json();
                throw new Error(`업로드 초기화 실패: ${err.error?.message || '알 수 없는 오류'}`);
            }
            
            const uploadUrl = initRes.headers.get('X-Goog-Upload-URL');

            const uploadRes = await fetch(uploadUrl, {
                method: 'POST',
                headers: {
                    'X-Goog-Upload-Command': 'upload, finalize',
                    'X-Goog-Upload-Offset': '0',
                    'Content-Type': mimeType
                },
                body: blob
            });

            if(!uploadRes.ok) {
                const err = await uploadRes.json();
                throw new Error(`파일 전송 실패: ${err.error?.message || '알 수 없는 오류'}`);
            }
            
            const fileInfo = await uploadRes.json();
            return { uri: fileInfo.file.uri, name: fileInfo.file.name };
        }

        async function waitForFileActive(fileName, apiKey) {
            let state = 'PROCESSING';
            let attempts = 0;
            
            while (state === 'PROCESSING') {
                if (attempts > 0) {
                    await new Promise(resolve => setTimeout(resolve, 3000));
                }
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}?key=${apiKey}`);
                if (!res.ok) {
                    throw new Error('파일 상태를 확인하는 중 오류가 발생했습니다.');
                }
                
                const data = await res.json();
                state = data.state;
                
                if (state === 'FAILED') {
                    throw new Error('구글 서버가 파일을 분석하는 데 실패했습니다. 파일이 손상되었을 수 있습니다.');
                }
                attempts++;
                
                if (attempts > 60) {
                    throw new Error('파일 처리 시간이 초과되었습니다.');
                }
            }
        }

        async function generateNotesWithGemini(modelName, audioUri, pdfUri, apiKey, currentFileName) {
            const url = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;
            
            const parts = [];

            parts.push({ text: `[현재 작업 중인 파일명 (이 파일명을 기준으로 제목을 생성하세요)]: ${currentFileName}\n\n` + SECRET_PROMPT });
            parts.push({ fileData: { mimeType: "audio/mp4", fileUri: audioUri } });

            if (pdfUri) {
                parts.push({
                    text: "\n\n[★매우 중요한 추가 지시사항★]\n첨부된 강의록(PDF) 문서는 **오직 '의학 용어 철자(스펠링) 확인용 사전'**으로만 사용하세요. 절대로 PDF 문서에 적혀있지만 '방금 들려준 오디오(해당 차시)'에서 교수님이 직접 말하지 않은 내용을 강의 노트에 추가해서는 안 됩니다. 노트의 내용은 100% 오디오 파일의 음성에만 기반해야 합니다."
                });
                parts.push({ fileData: { mimeType: "application/pdf", fileUri: pdfUri } });
            }

            const payload = {
                contents: [{ parts: parts }],
                safetySettings: [
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" }
                ]
            };

            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(!res.ok) {
                const errData = await res.json();
                if (res.status === 429) {
                    throw new Error("무료 API 요청 한도를 초과했습니다. 1~2분 뒤에 다시 시도해주세요.");
                }
                throw new Error(`API 오류: ${errData.error?.message || '알 수 없는 내부 오류'}`);
            }

            const data = await res.json();
            
            try {
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                throw new Error('AI가 올바른 응답을 반환하지 않았습니다. 내용이 안전 필터에 걸렸을 수 있습니다.');
            }
        }

        // --- 6. 리셋 ---
        restartBtn.addEventListener('click', () => {
            fileInput.value = '';
            pdfFileInput.value = '';
            fileInput.disabled = false;
            pdfFileInput.disabled = false;
            statusArea.classList.add('hidden');
            statusArea.classList.remove('flex');
            resultArea.classList.add('hidden');
            statusText.classList.replace('text-green-600', 'text-indigo-600');
            statusText.classList.replace('text-red-500', 'text-indigo-600');
            startBtn.classList.remove('hidden');
            startBtn.disabled = false;
            globalPdfData = null;
        });

    </script>
