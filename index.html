<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 대시보드 - 수림 AI 통합 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="fixed top-0 w-full max-w-5xl flex justify-between items-center p-6">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span id="userEmail" class="text-sm font-medium text-gray-600">불러오는 중...</span>
        </div>
        <button id="logoutBtn" class="text-xs font-bold text-red-400 hover:text-red-600 border border-red-200 px-3 py-1 rounded-full transition-all">
            로그아웃
        </button>
    </div>

    <div class="w-full max-w-4xl space-y-12 text-center">
        <header class="space-y-4">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
                어떤 작업을 시작할까요?
            </h1>
            <p class="text-gray-500">수림 AI가 당신의 학습 효율을 극대화해 드립니다.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <a href="notes.html" class="menu-card bg-white p-10 rounded-[2.5rem] shadow-xl shadow-indigo-100 border border-gray-100 flex flex-col items-center gap-6 group">
                <div class="bg-indigo-100 text-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors shadow-inner">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </div>
                <div class="space-y-2">
                    <h2 class="text-2xl font-bold text-gray-800">오디오 수업노트</h2>
                    <p class="text-sm text-gray-500">녹취록을 분할하고 AI가 핵심을 요약합니다.</p>
                </div>
                <span class="text-indigo-600 font-bold flex items-center gap-1 group-hover:gap-2 transition-all">
                    시작하기 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </span>
            </a>

            <a href="quiz.html" class="menu-card bg-white p-10 rounded-[2.5rem] shadow-xl shadow-blue-100 border border-gray-100 flex flex-col items-center gap-6 group">
                <div class="bg-blue-100 text-blue-600 w-20 h-20 rounded-3xl flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-inner">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <div class="space-y-2">
                    <h2 class="text-2xl font-bold text-gray-800">AI 맞춤 퀴즈</h2>
                    <p class="text-sm text-gray-500">PDF 강의록을 바탕으로 시험 문제를 만듭니다.</p>
                </div>
                <span class="text-blue-600 font-bold flex items-center gap-1 group-hover:gap-2 transition-all">
                    시작하기 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </span>
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Firebase 설정 (기존 정보 그대로 유지)
        const firebaseConfig = {
            apiKey: "AIzaSyAsVUHLS6sEbol_ChhQEkgM8XJqn44Gku0", /* ⚠️ 주의: 실제 사용 시 Firebase 콘솔에서 발급받은 apiKey를 꼭 넣으세요! */
            authDomain: "ai-note-generator-d8178.firebaseapp.com",
            projectId: "ai-note-generator-d8178",
            storageBucket: "ai-note-generator-d8178.firebasestorage.app",
            messagingSenderId: "174063925999",
            appId: "1:174063925999:web:4cc68529cf770e3bf8f91a",
            measurementId: "G-VQZVZLKWC7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const userEmailSpan = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        // 🌟 보안 요원: 로그인 상태 체크
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 로그인 상태면 이메일을 화면에 표시합니다.
                userEmailSpan.innerText = user.email + " 님 환영합니다";
            } else {
                // 로그인이 안 되어 있으면 즉시 login.html로 쫓아냅니다.
                window.location.href = "login.html";
            }
        });

        // 로그아웃 처리
        logoutBtn.addEventListener('click', async () => {
            if (confirm("로그아웃 하시겠습니까?")) {
                try {
                    await signOut(auth);
                    // signOut이 완료되면 onAuthStateChanged 요원이 자동으로 login.html로 보내줍니다.
                } catch (error) {
                    console.error("로그아웃 실패:", error);
                }
            }
        });
    </script>
</body>
</html>
