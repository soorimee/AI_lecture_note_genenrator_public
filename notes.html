[작업 지침]

    - "국시", "시험", "야마", "족보", "중요하다" 언급 시 **(★국시/시험 출제 유력)** 태그를 붙이세요.

[출력 형식]
# [제공된 파일명에 기반한 년월일, 교시, 차시] 녹취록 기반 강의 정리

**Topic 1. [목차의 대주제]**

- **상세 설명:**
    - (오디오 녹취록 바탕 심층 설명 - 의학 용어는 영어로)
    - **(★반복 강조) [내용]**
- **(★교수님 예제/상황 가정):** (문제 출제 예시, 상황 설명)

        // --- 기존 로직 (FFmpeg, API 호출 등) - 절대 수정 없음 ---
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({
            corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            mainName: 'main', 
            log: true,
        });

        const apiKeyInput = document.getElementById('apiKeyInput');
        const fileInput = document.getElementById('audioFile');
        const pdfFileInput = document.getElementById('pdfFile');
        const customPromptInput = document.getElementById('customPrompt');
        const splitMinutesInput = document.getElementById('splitMinutes');
        const overlapMinutesInput = document.getElementById('overlapMinutes');
        const startBtn = document.getElementById('startBtn');
        const statusArea = document.getElementById('statusArea');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('statusText');
        const logText = document.getElementById('logText');
        const resultArea = document.getElementById('resultArea');
        const downloadList = document.getElementById('downloadList');
        const resultCount = document.getElementById('resultCount');
        const restartBtn = document.getElementById('restartBtn');

        let globalPdfData = null;
        const savedApiKey = localStorage.getItem('gemini_api_key');
        if (savedApiKey) apiKeyInput.value = savedApiKey;
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        ffmpeg.setLogger(({ type, message }) => {
            if(type === 'fferr' || type === 'ffout') logText.innerText = message;
        });

        const getAudioDuration = (file) => {
            return new Promise((resolve, reject) => {
                const audio = new Audio(URL.createObjectURL(file));
                audio.onloadedmetadata = () => resolve(audio.duration);
                audio.onerror = () => reject("오디오 길이를 확인할 수 없습니다.");
            });
        };

        // --- 이하 오디오 분할 및 AI 호출 로직 전체 (기존 코드 그대로 복사됨) ---
        startBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) { alert('파일을 선택해주세요.'); return; }
            const segmentMinutes = parseInt(splitMinutesInput.value) || 30;
            const overlapMinutes = parseInt(overlapMinutesInput.value) || 2;
            const apiKey = apiKeyInput.value.trim();
            if (apiKey) localStorage.setItem('gemini_api_key', apiKey);

            startBtn.disabled = true;
            statusArea.classList.remove('hidden');
            statusArea.classList.add('flex');
            resultArea.classList.add('hidden');
            downloadList.innerHTML = '';

            try {
                statusText.innerText = '오디오 분석 중...';
                const totalDurationSec = await getAudioDuration(file);
                if (!ffmpeg.isLoaded()) await ffmpeg.load();

                const fileName = file.name;
                const lastDotIndex = fileName.lastIndexOf('.');
                let originalNameWithoutExt = fileName.substring(0, lastDotIndex);
                let ext = fileName.substring(lastDotIndex + 1);

                ffmpeg.FS('writeFile', 'input.'+ext, await fetchFile(file));

                const segmentTimeSec = segmentMinutes * 60;
                const stepTimeSec = (segmentMinutes - overlapMinutes) * 60;
                let startTimeSec = 0;
                let segmentIndex = 0;
                const expectedFiles = [];

                while (startTimeSec < totalDurationSec) {
                    const outName = `output_${segmentIndex}.${ext}`;
                    expectedFiles.push({ fileName: outName, startMin: Math.round(startTimeSec/60), endMin: Math.round(Math.min(startTimeSec+segmentTimeSec, totalDurationSec)/60), index: segmentIndex });
                    await ffmpeg.run('-ss', startTimeSec.toString(), '-t', segmentTimeSec.toString(), '-i', 'input.'+ext, '-c:a', 'aac', '-b:a', '128k', outName);
                    startTimeSec += stepTimeSec;
                    segmentIndex++;
                }

                for (const seg of expectedFiles) {
                    const data = ffmpeg.FS('readFile', seg.fileName);
                    const blob = new Blob([data.buffer], { type: 'audio/mp4' });
                    const url = URL.createObjectURL(blob);
                    addResultItem(url, `${originalNameWithoutExt} ${seg.index+1}차시 (${seg.startMin}분~${seg.endMin}분).${ext}`, blob, seg.index);
                }
                statusText.innerText = '분할 완료!';
                resultCount.innerText = `${expectedFiles.length}개 파일`;
                resultArea.classList.remove('hidden');
                spinner.classList.add('hidden');
            } catch (e) {
                statusText.innerText = '오류 발생: ' + e.message;
            }
        });

        // 결과 항목 추가 및 AI 호출 함수 (기존 로직 동일)
        function addResultItem(url, filename, audioBlob, index) {
            const itemDiv = document.createElement('div');
            itemDiv.className = "flex flex-col bg-gray-50 border border-gray-200 rounded-xl overflow-hidden";
            itemDiv.innerHTML = `
                <div class="flex items-center justify-between p-3">
                    <span class="text-sm font-medium text-gray-700 truncate w-2/3">${filename}</span>
                    <div class="flex gap-2">
                        <a href="${url}" download="${filename}" class="px-2 py-1 bg-white border rounded text-xs">다운로드</a>
                        <button id="aiBtn_${index}" class="px-2 py-1 bg-indigo-600 text-white rounded text-xs font-bold">✨ AI 노트</button>
                    </div>
                </div>
                <div id="noteArea_${index}" class="hidden border-t p-3 bg-white">
                    <span id="noteStatus_${index}" class="text-xs font-bold text-indigo-600">준비중...</span>
                    <textarea id="noteText_${index}" class="hidden w-full h-48 mt-2 p-2 text-sm border rounded bg-gray-50" readonly></textarea>
                </div>
            `;
            downloadList.appendChild(itemDiv);

            itemDiv.querySelector(`#aiBtn_${index}`).addEventListener('click', async () => {
                const btn = itemDiv.querySelector(`#aiBtn_${index}`);
                const status = itemDiv.querySelector(`#noteStatus_${index}`);
                const text = itemDiv.querySelector(`#noteText_${index}`);
                const area = itemDiv.querySelector(`#noteArea_${index}`);

                btn.disabled = true;
                area.classList.remove('hidden');
                
                try {
                    const apiKey = apiKeyInput.value.trim();
                    if (pdfFileInput.files.length > 0 && !globalPdfData) {
                        status.innerText = "PDF 분석 중...";
                        globalPdfData = await uploadAndPollFile(pdfFileInput.files[0], 'application/pdf', apiKey, "Lecture.pdf");
                    }
                    status.innerText = "오디오 전송 중...";
                    const audioData = await uploadAndPollFile(audioBlob, 'audio/mp4', apiKey, "audio.m4a");
                    await waitForFileActive(audioData.name, apiKey);
                    
                    status.innerText = "노트 생성 중...";
                    const result = await generateNotesWithGemini('models/gemini-1.5-flash', audioData.uri, globalPdfData?.uri, apiKey, filename, customPromptInput.value);
                    text.value = result;
                    text.classList.remove('hidden');
                    status.innerText = "✅ 완료";
                } catch(e) {
                    status.innerText = "❌ 오류: " + e.message;
                    btn.disabled = false;
                }
            });
        }

        // --- 공통 API 함수들 (기존 그대로 복제) ---
        async function uploadAndPollFile(blob, mimeType, apiKey, displayName) {
            const initRes = await fetch(`https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`, {
                method: 'POST',
                headers: { 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start', 'X-Goog-Upload-Header-Content-Length': blob.size.toString(), 'X-Goog-Upload-Header-Content-Type': mimeType, 'Content-Type': 'application/json' },
                body: JSON.stringify({ file: { display_name: displayName } })
            });
            const uploadUrl = initRes.headers.get('X-Goog-Upload-URL');
            const uploadRes = await fetch(uploadUrl, { method: 'POST', headers: { 'X-Goog-Upload-Command': 'upload, finalize', 'X-Goog-Upload-Offset': '0', 'Content-Type': mimeType }, body: blob });
            const fileInfo = await uploadRes.json();
            return { uri: fileInfo.file.uri, name: fileInfo.file.name };
        }

        async function waitForFileActive(fileName, apiKey) {
            let state = 'PROCESSING';
            while (state === 'PROCESSING') {
                await new Promise(r => setTimeout(r, 3000));
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}?key=${apiKey}`);
                const data = await res.json();
                state = data.state;
                if (state === 'FAILED') throw new Error('분석 실패');
            }
        }

        async function generateNotesWithGemini(modelName, audioUri, pdfUri, apiKey, currentFileName, customPromptText) {
            let finalPrompt = `[파일]: ${currentFileName}\n\n` + SECRET_PROMPT;
            if (customPromptText) finalPrompt += `\n\n[추가]: ${customPromptText}`;
            const parts = [{ text: finalPrompt }, { fileData: { mimeType: "audio/mp4", fileUri: audioUri } }];
            if (pdfUri) parts.push({ text: "PDF 참고", fileData: { mimeType: "application/pdf", fileUri: pdfUri } });

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: parts }] })
            });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }

        restartBtn.addEventListener('click', () => location.reload());
    </script>
</body>
