<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 수림 AI 통합 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="login-container" class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-10 text-center space-y-6">
        <div class="bg-indigo-100 text-indigo-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-800">수림 AI 통합 서비스</h1>
        <p class="text-gray-500 text-sm mb-6">이 서비스는 허가된 사용자만 이용 가능합니다.<br>승인된 Google 계정으로 로그인해 주세요.</p>
        
        <div id="loginErrorMessage" class="hidden bg-red-50 text-red-600 border border-red-200 p-3 rounded-lg text-sm font-bold mb-4">
            </div>

        <button id="googleLoginBtn" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-4 px-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-3">
            <svg class="w-6 h-6" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google 계정으로 계속하기
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 🔥 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAsVUHLS6sEbol_ChhQEkgM8XJqn44Gku0", // ⚠️ 잊지 말고 수정하세요!
            authDomain: "ai-note-generator-d8178.firebaseapp.com",
            projectId: "ai-note-generator-d8178",
            storageBucket: "ai-note-generator-d8178.firebasestorage.app",
            messagingSenderId: "174063925999",
            appId: "1:174063925999:web:4cc68529cf770e3bf8f91a",
            measurementId: "G-VQZVZLKWC7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const errorMsg = document.getElementById('loginErrorMessage');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        // 🌟 로그인 유저에 대해 DB 권한(Whitelist) 체크 수행
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // DB의 'allowed_users' 컬렉션에서 로그인한 이메일 문서 찾기
                    const userDocRef = doc(db, "allowed_users", user.email);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        // 승인된 계정이면 메인 페이지로 이동
                        window.location.href = "index.html"; 
                    } else {
                        // 미승인 계정이면 즉시 로그아웃 시키고 경고창 띄움
                        await signOut(auth);
                        errorMsg.innerText = "사용 권한이 없는 계정입니다. 관리자에게 승인을 요청하세요.";
                        errorMsg.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error("권한 확인 실패:", error);
                    await signOut(auth);
                    errorMsg.innerText = "데이터베이스 통신 중 오류가 발생했습니다.";
                    errorMsg.classList.remove('hidden');
                }
            }
        });

        // 🌟 구글 로그인 버튼 클릭 이벤트
        const provider = new GoogleAuthProvider();
        googleLoginBtn.addEventListener('click', async () => {
            errorMsg.classList.add('hidden'); // 클릭 시 기존 에러 메시지 숨김
            
            try {
                // 구글 로그인 팝업 띄우기
                await signInWithPopup(auth, provider);
                // 로그인이 성공하면 위의 onAuthStateChanged가 알아서 작동하여 DB 검사를 시작합니다.
            } catch (error) {
                console.error("로그인 에러:", error);
                
                // 사용자가 팝업을 그냥 닫은 경우가 아니라면 에러 메시지 출력
                if(error.code !== 'auth/popup-closed-by-user') {
                    errorMsg.innerText = "로그인 과정에서 오류가 발생했습니다.";
                    errorMsg.classList.remove('hidden');
                }
            }
        });
    </script>
</body>
</html>
